// WEB AUDIO SYNTHESIZER FOR CINEMATIC SFX (NO EXTERNAL ASSETS NEEDED)
// ============================================================================
class CyberAudioEngine {
  constructor() {
    this.ctx = null;
  }

  init() {
    if (!this.ctx && typeof window !== 'undefined') {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
  }

  playTick(isFinalTen = false) {
    try {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = isFinalTen ? 'sawtooth' : 'sine';
      osc.frequency.setValueAtTime(isFinalTen ? 880 : 520, now);
      osc.frequency.exponentialRampToValueAtTime(isFinalTen ? 440 : 260, now + 0.08);

      gain.gain.setValueAtTime(isFinalTen ? 0.12 : 0.04, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.09);
    } catch (e) {
      // Ignore audio block errors if user hasn't interacted
    }
  }

  playTransitionGlitch() {
    try {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;

      // Sub-bass impact drop
      const subOsc = this.ctx.createOscillator();
      const subGain = this.ctx.createGain();
      subOsc.type = 'sine';
      subOsc.frequency.setValueAtTime(140, now);
      subOsc.frequency.exponentialRampToValueAtTime(32, now + 0.65);
      subGain.gain.setValueAtTime(0.25, now);
      subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
      subOsc.connect(subGain);
      subGain.connect(this.ctx.destination);
      subOsc.start(now);
      subOsc.stop(now + 0.7);

      // High-tech digital arpeggio burst
      [660, 880, 1320, 1760].forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now + idx * 0.045);
        gain.gain.setValueAtTime(0.07, now + idx * 0.045);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.045 + 0.12);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + idx * 0.045);
        osc.stop(now + idx * 0.045 + 0.13);
      });
    } catch (e) {}
  }
}

// ============================================================================
// MAIN APPLICATION COMPONENT
// ============================================================================
function App() {
  // Load saved config from localStorage if available
  const [config, setConfig] = useState(() => {
    try {
      const saved = localStorage.getItem('aidn_hacktoberfest26_config');
      return saved ? { ...DEFAULT_CONFIG, ...JSON.parse(saved) } : DEFAULT_CONFIG;
    } catch {
      return DEFAULT_CONFIG;
    }
  });

  const [stageIndex, setStageIndex] = useState(0);
  const [remainingSeconds, setRemainingSeconds] = useState(24 * 3600);
  const [controlPanelOpen, setControlPanelOpen] = useState(false);
  const [isGlitching, setIsGlitching] = useState(false);
  const [isRemoteOnlyWindow, setIsRemoteOnlyWindow] = useState(false);

  const fileInputRef = useRef(null);
  const broadcastRef = useRef(null);

  // Check if opened as dedicated Presenter Remote Pop-Out window
  useEffect(() => {
    if (typeof window !== 'undefined') {
      const params = new URLSearchParams(window.location.search);
      if (params.get('presenter') === 'true') {
        setIsRemoteOnlyWindow(true);
        setControlPanelOpen(true);
      }
    }
  }, []);

  // Save config & broadcast to synced tabs/windows
  useEffect(() => {
    try {
      localStorage.setItem('aidn_hacktoberfest26_config', JSON.stringify(config));
    } catch {}
    if (broadcastRef.current) {
      broadcastRef.current.postMessage({ type: 'SYNC_CONFIG', config });
    }
  }, [config]);

  // Setup BroadcastChannel for Dual-Screen Presenter Mode
  useEffect(() => {
    if (typeof window !== 'undefined' && 'BroadcastChannel' in window) {
      const ch = new BroadcastChannel('aidn_pune_hacktoberfest_2026_channel');
      broadcastRef.current = ch;
      ch.onmessage = (event) => {
        const data = event.data;
        if (!data) return;
        if (data.type === 'SYNC_CONFIG') {
          setConfig(data.config);
        } else if (data.type === 'JUMP_STAGE') {
          triggerStageTransition(data.stageIndex, false);
        } else if (data.type === 'RESET_CUSTOM_TIMER') {
          setRemainingSeconds(data.seconds);
        }
      };
      return () => ch.close();
    }
  }, []);

  // Trigger High-Tech Glitch Transition Between Stages
  const triggerStageTransition = useCallback(
    (nextIdx, broadcast = true) => {
      const clamped = Math.max(0, Math.min(STAGES.length - 1, nextIdx));
      setIsGlitching(true);
      if (config.soundEnabled) {
        sfx.playTransitionGlitch();
      }
      setTimeout(() => {
        setStageIndex(clamped);
      }, 140);
      setTimeout(() => {
        setIsGlitching(false);
      }, 360);

      if (broadcast && broadcastRef.current) {
        broadcastRef.current.postMessage({ type: 'JUMP_STAGE', stageIndex: clamped });
      }
    },
    [config.soundEnabled]
  );

  // Compute or tick Countdown Timer
  useEffect(() => {
    if (config.timerMode === 'target') {
      const computeTargetDiff = () => {
        const offsetStr =
          config.timezoneLabel === 'IST'
            ? '+05:30'
            : config.timezoneLabel === 'UTC'
            ? 'Z'
            : '';
        const isoString = `${config.targetDate}T${config.targetTime}:00${offsetStr}`;
        const targetMs = new Date(isoString).getTime();
        const nowMs = Date.now();
        if (isNaN(targetMs)) return 24 * 3600;
        return Math.max(0, Math.floor((targetMs - nowMs) / 1000));
      };

      setRemainingSeconds(computeTargetDiff());
      const interval = setInterval(() => {
        const diff = computeTargetDiff();
        setRemainingSeconds(diff);
        if (diff === 0 && config.autoTransitionOnZero && stageIndex === 0 && config.isRunning) {
          setConfig((prev) => ({ ...prev, isRunning: false }));
          triggerStageTransition(1);
        }
      }, 1000);
      return () => clearInterval(interval);
    } else if (config.timerMode === 'custom') {
      if (!config.isRunning) return;
      const interval = setInterval(() => {
        setRemainingSeconds((prev) => {
          if (prev <= 1) {
            if (config.autoTransitionOnZero && stageIndex === 0) {
              setTimeout(() => triggerStageTransition(1), 200);
            }
            setConfig((c) => ({ ...c, isRunning: false }));
            return 0;
          }
          const nextVal = prev - 1;
          if (config.soundEnabled && nextVal <= 10) {
            sfx.playTick(true);
          }
          return nextVal;
        });
      }, 1000);
      return () => clearInterval(interval);
    }
  }, [
    config.timerMode,
    config.targetDate,
    config.targetTime,
    config.timezoneLabel,
    config.isRunning,
    config.autoTransitionOnZero,
    config.soundEnabled,
    stageIndex,
    triggerStageTransition,
  ]);

  const resetCustomTimer = (totalSeconds, runImmediately = false) => {
    setRemainingSeconds(totalSeconds);
    setConfig((prev) => ({
      ...prev,
      timerMode: 'custom',
      isRunning: runImmediately,
    }));
    if (broadcastRef.current) {
      broadcastRef.current.postMessage({ type: 'RESET_CUSTOM_TIMER', seconds: totalSeconds });
    }
  };

  // 10-Second Opening Ceremony Preview Sequence
  const triggerQuick10SecPreview = () => {
    triggerStageTransition(0);
    setRemainingSeconds(10);
    setConfig((prev) => ({
      ...prev,
      timerMode: 'custom',
      customHours: 0,
      customMinutes: 0,
      customSeconds: 10,
      isRunning: true,
      autoTransitionOnZero: true,
    }));
  };

  // Keyboard Navigation for Presenter
  useEffect(() => {
    const handleKeyDown = (e) => {
      // Ignore shortcuts when typing in an input field
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target?.tagName)) {
        if (e.key === 'Escape') setControlPanelOpen(false);
        return;
      }

      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        triggerStageTransition(stageIndex + 1);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        triggerStageTransition(stageIndex - 1);
      } else if (e.key === '1') {
        triggerStageTransition(0);
      } else if (e.key === '2') {
        triggerStageTransition(1);
      } else if (e.key === '3') {
        triggerStageTransition(3);
      } else if (e.key === 'c' || e.key === 'C' || e.key === 'o' || e.key === 'O') {
        setControlPanelOpen((prev) => !prev);
      } else if (e.key === 'Escape') {
        setControlPanelOpen(false);
      } else if (e.key === 'p' || e.key === 'P') {
        setConfig((prev) => ({
          ...prev,
          timerMode: prev.timerMode === 'static24' ? 'custom' : prev.timerMode,
          isRunning: !prev.isRunning,
        }));
      } else if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen?.().catch(() => {});
        } else {
          document.exitFullscreen?.().catch(() => {});
        }
      }
    };

    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [stageIndex, triggerStageTransition]);

  // Handle Custom Organizer Portrait Upload
  const handleFileUpload = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      setConfig((prev) => ({ ...prev, organizerPhotoUrl: ev.target.result }));
    };
    reader.readAsDataURL(file);
  };

  // Open Second Synchronized Window for Presenter Laptop
  const openPopupRemote = () => {
    const url = new URL(window.location.href);
    url.searchParams.set('presenter', 'true');
    window.open(url.toString(), 'AIDN_Presenter_Remote', 'width=560,height=820');
  };

  const currentStage = STAGES[stageIndex] || STAGES[0];

  return (
    <div className="relative w-screen h-screen overflow-hidden bg-[#030712] select-none">
      {/* Load Required Futuristic Display Fonts */}
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,500;0,600;0,700;1,700&family=Orbitron:wght@600;700;800;900&display=swap');

        @keyframes floatPulse {
          0% { transform: translateY(0px) scale(1); opacity: 0.85; }
          100% { transform: translateY(-8px) scale(1.06); opacity: 1; }
        }

        @keyframes glitchSlice {
          0% { transform: translate(0); filter: hue-rotate(0deg); }
          25% { transform: translate(-8px, 3px) skewX(3deg); filter: drop-shadow(6px 0 #FF1E27) drop-shadow(-6px 0 #0088FF); }
          50% { transform: translate(8px, -3px) skewX(-3deg); }
          75% { transform: translate(-4px, 1px); }
          100% { transform: translate(0); }
        }

        .cyber-glitch-active {
          animation: glitchSlice 0.34s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
        }
      `}</style>

      {/* Hidden File Input for Custom Speaker Photo Swap */}
      <input
        ref={fileInputRef}
        type="file"
        accept="image/*"
        onChange={handleFileUpload}
        className="hidden"
      />

      {/* Consistent Deep-Navy Grid + Floating Geometric Pixels Background */}
      <TechnicalBackground
        scanlines={config.scanlinesEnabled}
        particles={config.particlesEnabled}
        showOuterHudCorners={currentStage.id === 'INTRO_ORGANIZER'}
      />

      {/* Audience-Facing Stage Viewport */}
      <main
        className={`relative z-10 w-full h-full transition-opacity duration-150 ${
          isGlitching ? 'cyber-glitch-active opacity-90' : 'opacity-100'
        }`}
      >
        {currentStage.id === 'COUNTDOWN' && (
          <Mode1CountdownView
            config={config}
            remainingSeconds={remainingSeconds}
            onTriggerNext={() => triggerStageTransition(1)}
          />
        )}

        {currentStage.id === 'INTRO_ORGANIZER' && (
          <Mode2AOrganizerIntroView
            config={config}
            onNextStage={() => triggerStageTransition(2)}
            onUploadPhoto={() => fileInputRef.current?.click()}
          />
        )}

        {currentStage.id === 'EVENT_REVEAL' && (
          <Mode2BEventRevealView
            config={config}
            onNextStage={() => triggerStageTransition(3)}
          />
        )}

        {currentStage.mode === 3 && (
          <Mode3MlhDeckView
            stageId={currentStage.id}
            config={config}
            onNext={() => triggerStageTransition(stageIndex + 1)}
            onPrev={() => triggerStageTransition(stageIndex - 1)}
            currentSlideIndex={stageIndex - 2}
            totalSlides={STAGES.length - 3}
          />
        )}
      </main>

      {/* Invisible-Until-Hovered Bottom-Right Presenter Hotspot (Zero clutter on projector!) */}
      <div className="fixed bottom-3 right-3 z-40 flex items-center gap-2 opacity-0 hover:opacity-100 transition-opacity duration-200">
        <button
          onClick={() => triggerStageTransition(stageIndex - 1)}
          className="p-2 bg-[#050e24]/90 border border-[#0077FF]/60 text-white rounded hover:bg-[#0077FF]"
          title="Previous Stage (Left Arrow)"
        >
          <ChevronLeft className="w-4 h-4" />
        </button>
        <button
          onClick={() => triggerStageTransition(stageIndex + 1)}
          className="p-2 bg-[#050e24]/90 border border-[#0077FF]/60 text-white rounded hover:bg-[#0077FF]"
          title="Next Stage (Right Arrow / Space)"
        >
          <ChevronRight className="w-4 h-4" />
        </button>
        <button
          onClick={() => {
            if (!document.fullscreenElement) {
              document.documentElement.requestFullscreen?.().catch(() => {});
            } else {
              document.exitFullscreen?.().catch(() => {});
            }
          }}
          className="p-2 bg-[#050e24]/90 border border-[#0077FF]/60 text-white rounded hover:bg-[#0077FF]"
          title="Fullscreen Projector (F)"
        >
          <Maximize2 className="w-4 h-4" />
        </button>
        <button
          onClick={() => setControlPanelOpen(true)}
          className="flex items-center gap-1.5 px-3 py-2 bg-[#050e24]/90 border border-[#0077FF] text-xs font-bold tracking-wider uppercase text-white rounded hover:bg-[#0077FF]"
          title="Open Organizer Control Panel (Hotkey: C)"
        >
          <Settings className="w-4 h-4" />
          <span>Controls [C]</span>
        </button>
      </div>

      {/* Organizer Control Panel Drawer / Remote */}
      <OrganizerControlPanel
        isOpen={controlPanelOpen}
        onClose={() => setControlPanelOpen(false)}
        config={config}
        setConfig={setConfig}
        stageIndex={stageIndex}
        jumpToStage={(idx) => triggerStageTransition(idx)}
        remainingSeconds={remainingSeconds}
        resetCustomTimer={resetCustomTimer}
        triggerQuick10SecPreview={triggerQuick10SecPreview}
        openPopupRemote={openPopupRemote}
        isRemoteOnlyWindow={isRemoteOnlyWindow}
        onUploadPhotoClick={() => fileInputRef.current?.click()}
      />
    </div>
  );
}
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
